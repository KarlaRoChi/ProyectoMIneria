name: mineria_stroke

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # Data manipulation
  - pandas>=2.0
  - numpy>=1.24

  # Machine learning
  - scikit-learn>=1.3
  - imbalanced-learn>=0.11

  # Visualisation
